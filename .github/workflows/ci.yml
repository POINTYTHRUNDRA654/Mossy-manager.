name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ── Python unit tests (Linux, multiple Python versions) ─────────────────
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run tests
        run: pytest tests/ -v --cov=src/mossy_manager --cov-report=term-missing

  # ── Windows exe build + smoke-test ──────────────────────────────────────
  # Builds MossyManager.exe on every push/PR so the artifact is always
  # available for download from the Actions UI without waiting for a release.
  build-exe:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      # Workaround: the repo name ends with a dot which Windows normalises away,
      # causing actions/checkout to report "Directory does not exist".
      # Pre-creating the workspace directory via cmd.exe avoids the issue.
      - name: Create workspace directory (Windows trailing-dot workaround)
        shell: cmd
        run: if not exist "%GITHUB_WORKSPACE%" mkdir "%GITHUB_WORKSPACE%"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip install -e .

      - name: Build MossyManager.exe
        run: python build.py

      # Verify the exe starts and exits cleanly with --version (no display needed)
      - name: Smoke-test — version flag
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\dist\MossyManager.exe" `
               -ArgumentList "--version" -Wait -PassThru -WindowStyle Hidden
          Write-Host "Exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            Write-Error "Smoke test failed: --version returned exit code $($p.ExitCode)"
            exit 1
          }
          Write-Host "Smoke test passed."

      # Verify --help exits cleanly too
      - name: Smoke-test — help flag
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\dist\MossyManager.exe" `
               -ArgumentList "--help" -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) {
            Write-Error "Smoke test failed: --help returned exit code $($p.ExitCode)"
            exit 1
          }

      # Upload MossyManager.exe as a downloadable artifact
      - name: Upload MossyManager.exe
        uses: actions/upload-artifact@v4
        with:
          name: MossyManager-Windows
          path: dist/MossyManager.exe
          if-no-files-found: error

      # Upload the MO2-ready package (exe + MossyManager.ini)
      - name: Upload MO2 Tools Package
        uses: actions/upload-artifact@v4
        with:
          name: MO2_Tools_Package
          path: dist/MO2_Tools_Package/
          if-no-files-found: error

