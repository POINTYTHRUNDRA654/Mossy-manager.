name: Build and Release

on:
  release:
    types: [created]
  push:
    tags:
      - 'v*'  # Automatically build and publish when a version tag is pushed
  workflow_dispatch:  # Allow manual triggers
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip install -e .

      - name: Build executable
        run: python build.py

      # Smoke-tests: flags that exit before opening the GUI window
      - name: Smoke-test — version flag
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\dist\MossyManager.exe" `
               -ArgumentList "--version" -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) {
            Write-Error "Smoke test FAILED (exit $($p.ExitCode))"; exit 1
          }
          Write-Host "Smoke test passed."

      - name: Smoke-test — help flag
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\dist\MossyManager.exe" `
               -ArgumentList "--help" -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) {
            Write-Error "Smoke test FAILED (exit $($p.ExitCode))"; exit 1
          }

      - name: Zip MO2 Tools Package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\MO2_Tools_Package\*" `
            -DestinationPath "dist\MO2_Tools_Package-Windows.zip" -Force

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: MossyManager-Windows
          path: dist/MossyManager.exe

      - name: Upload MO2 package
        uses: actions/upload-artifact@v4
        with:
          name: MO2_Tools_Package-Windows
          path: dist/MO2_Tools_Package-Windows.zip

      - name: Upload to release
        if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MossyManager.exe
            dist/MO2_Tools_Package-Windows.zip

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip install -e .

      - name: Build executable
        run: python build.py

      - name: Make executable
        run: chmod +x dist/MossyManager

      # On Linux the exe exits cleanly for --version even without a display
      - name: Smoke-test — version flag
        run: |
          ./dist/MossyManager --version
          echo "Smoke test passed (exit $?)"

      - name: Smoke-test — help flag
        run: ./dist/MossyManager --help

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: MossyManager-Linux
          path: dist/MossyManager

      - name: Upload to release
        if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MossyManager

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip install -e .

      - name: Build executable
        run: python build.py

      - name: Make executable
        run: chmod +x dist/MossyManager

      - name: Smoke-test — version flag
        run: |
          ./dist/MossyManager --version
          echo "Smoke test passed."

      - name: Smoke-test — help flag
        run: ./dist/MossyManager --help

      - name: Create DMG
        if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        run: |
          hdiutil create -volname "MossyManager" -srcfolder dist -ov -format UDZO MossyManager-macOS.dmg

      - name: Upload macOS executable
        uses: actions/upload-artifact@v4
        with:
          name: MossyManager-macOS
          path: dist/MossyManager

      - name: Upload to release
        if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          files: MossyManager-macOS.dmg

