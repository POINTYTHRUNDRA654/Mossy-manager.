name: Build and Release

on:
  release:
    types: [created]
  workflow_dispatch:  # Allow manual triggers
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build executable
        run: |
          python build.py
      
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: MossyManager-Windows
          path: dist/MossyManager.exe
      
      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MossyManager.exe
  
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build executable
        run: |
          python build.py
      
      - name: Make executable
        run: |
          chmod +x dist/MossyManager
      
      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: MossyManager-Linux
          path: dist/MossyManager
      
      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MossyManager
  
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build executable
        run: |
          python build.py
      
      - name: Make executable
        run: |
          chmod +x dist/MossyManager
      
      - name: Create DMG
        if: github.event_name == 'release'
        run: |
          hdiutil create -volname "MossyManager" -srcfolder dist -ov -format UDZO MossyManager-macOS.dmg
      
      - name: Upload macOS executable
        uses: actions/upload-artifact@v4
        with:
          name: MossyManager-macOS
          path: dist/MossyManager
      
      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: MossyManager-macOS.dmg
