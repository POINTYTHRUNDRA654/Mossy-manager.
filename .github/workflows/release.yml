name: Build and Release

on:
  release:
    types: [created]
  push:
    tags:
      - 'v*'  # Automatically build and publish when a version tag is pushed
  workflow_dispatch:  # Allow manual triggers
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build executable
        run: |
          python build.py
      
      - name: Smoke-test the executable
        run: |
          .\dist\MossyManager.exe --help
          .\dist\MossyManager.exe info
          .\dist\MossyManager.exe --version
        shell: pwsh

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: MossyManager-Windows
          path: dist/MossyManager.exe
      
      - name: Upload to release
        if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MossyManager.exe
          name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
  
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build executable
        run: |
          python build.py
      
      - name: Make executable
        run: |
          chmod +x dist/MossyManager
      
      - name: Smoke-test the executable
        run: |
          ./dist/MossyManager --help
          ./dist/MossyManager info
          ./dist/MossyManager --version

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: MossyManager-Linux
          path: dist/MossyManager
      
      - name: Upload to release
        if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MossyManager
          name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
  
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build executable
        run: |
          python build.py
      
      - name: Make executable
        run: |
          chmod +x dist/MossyManager
      
      - name: Smoke-test the executable
        run: |
          ./dist/MossyManager --help
          ./dist/MossyManager info
          ./dist/MossyManager --version

      - name: Create DMG
        if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        run: |
          hdiutil create -volname "MossyManager" -srcfolder dist -ov -format UDZO MossyManager-macOS.dmg
      
      - name: Upload macOS executable
        uses: actions/upload-artifact@v4
        with:
          name: MossyManager-macOS
          path: dist/MossyManager
      
      - name: Upload to release
        if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          files: MossyManager-macOS.dmg
          name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
